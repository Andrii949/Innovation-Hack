# Bun is the package manager, linter and formatter for this project.
# Both sections are strict on purpose: CI runs `bun lint` and `bun fmt --check`.

[fmt]
printWidth = 100
tabWidth = 2
semi = true
singleQuote = false
jsxSingleQuote = false
quoteProps = "as-needed"
trailingComma = "all"
bracketSpacing = true
bracketSameLine = false
arrowParens = "always"
objectWrap = "preserve"
endOfLine = "lf"
proseWrap = "preserve"
htmlWhitespaceSensitivity = "css"
sortImports = true
sortPackageJson = true
jsdoc = true

# Native projects are generated by Capacitor / Xcode; leave them as generated.
ignorePatterns = ["android", "ios"]

[lint]
# Type-aware lint rules on; type *errors* stay with `bun check` so linting stays fast.
typeAware = true
ignorePatterns = ["android", "ios"]

# Bug-catching categories only. `pedantic` and `style` are off on purpose: they carry
# preference-only rules (max-lines-per-function, prefer-readonly-parameter-types) that
# contradict each other and normal React, and layout is `bun fmt`'s job. `nursery` is unstable.
[lint.categories]
correctness = "error"
suspicious = "error"
perf = "error"

[lint.rules]
# Bug catchers the categories do not enable.
"eqeqeq" = ["error", "always", { null = "ignore" }]
"curly" = ["error", "all"]
"no-var" = "error"
"no-console" = "error"
"no-debugger" = "error"
"no-alert" = "error"
"no-warning-comments" = "error"
"no-eval" = "error"
"no-implied-eval" = "error"
"no-return-await" = "error"
"require-await" = "error"
"no-throw-literal" = "error"
"import/no-cycle" = "error"
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-floating-promises" = "error"
"@typescript-eslint/no-misused-promises" = "error"
"@typescript-eslint/consistent-type-imports" = "error"
"@typescript-eslint/switch-exhaustiveness-check" = "error"

# `bun fmt` owns import order and side-effect imports (CSS); the linter must not fight it.
"sort-imports" = "off"
"import/no-unassigned-import" = "off"

# Off: inline handlers are normal React; React Compiler memoizes them, and hand-written
# useCallback around every prop is noise, not safety.
"react-perf/jsx-no-new-function-as-prop" = "off"
